# Save as .github/workflows/aisg.yml in your repository.
# 1. AISG dashboard > Worker > "Advanced: connect a second PC manually" > Connect manually.
# 2. Repository > Settings > Secrets and variables > Actions > New secret
#    name: AISG_WORKER   value: <worker_id>:<secret>
name: AISG security scan
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  aisg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aisg-security/scan-action@v1
        with:
          aisg-worker: ${{ secrets.AISG_WORKER }}
          fail-on: none   # or: critical / high
